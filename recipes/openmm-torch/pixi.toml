# openmm-torch with PythonTorchForce for the default environment, built against
# conda-forge's OpenMM 8.6.1 and PyTorch 2.7.1: the CUDA 12.9 builds on Linux
# (x86-64, ARM64) and the CPU/OpenCL builds on macOS. The other variants are
# ../openmm-torch-cuda118 and ../openmm-torch-cuda13.
[workspace]
# Lets `pixi build --path recipes/openmm-torch` run standalone (Linux needs
# CONDA_OVERRIDE_CUDA=12.9 for the CUDA PyTorch host).
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "openmm-torch"
version = "1.5.1.20260624"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
