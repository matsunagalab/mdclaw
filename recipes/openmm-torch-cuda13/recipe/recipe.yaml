# Same commit as ../../openmm-torch and ../../openmm-torch-cuda118: the master
# commit that introduced PythonTorchForce ("Create PythonTorchForce (#179)").
context:
  commit: b6532900ad825cb3d12193817a1e34a7f46ae6a3

package:
  name: openmm-torch
  version: "1.5.1.20260624"

source:
  git: https://github.com/openmm/openmm-torch.git
  rev: ${{ commit }}

build:
  number: 0
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - "*/libcuda.*"
      - "*/libOpenCL.*"

requirements:
  build:
    - cmake <4
    - make
    - swig
    - gcc_${{ target_platform }} 13.*
    - gxx_${{ target_platform }} 13.*
    - sysroot_${{ target_platform }} 2.28.*
    - libgl-devel
    # Stay on CUDA 13.0: PTX from a newer minor toolkit may be rejected by a
    # driver whose maximum is 13.0, as on RIKYU.
    - cuda-version 13.0.*
    - cuda-nvcc
    - cuda-cudart-dev
    - cuda-nvrtc-dev
    - cuda-driver-dev
    - cuda-nvtx-dev
    - cuda-nvml-dev
    - cuda-profiler-api
    - libcufft-dev
    - libcublas-dev
    - libcurand-dev
    - libcusparse-dev
    - libcusolver-dev
  host:
    - python 3.12.*
    - pip
    - setuptools
    - swig
    - numpy
    # The CUDA 13 build by hash: conda-forge's CPU build of the same version
    # declares no cuda-version, so the pin below would not exclude it.
    - openmm 8.6.1.* py312hdb138ca*
    - pytorch 2.10.0.* cuda130*
    - cuda-version 13.0.*
    - ocl-icd
  run:
    - python 3.12.*
    - openmm 8.6.1.*
    - pytorch 2.10.0.*

tests:
  - python:
      imports:
        - openmmtorch

about:
  homepage: https://github.com/openmm/openmm-torch
  license: MIT
  summary: openmm-torch with PythonTorchForce for conda-forge OpenMM 8.6 and PyTorch 2.10 on CUDA 13.
