# Same commit, patch and build steps as container/scripts/build-plumed.sh.
context:
  commit: 95bfd46d6499625de03ea2151aec42edeae5f662

package:
  name: openmm-plumed
  version: "2.1"

source:
  git: https://github.com/openmm/openmm-plumed.git
  rev: ${{ commit }}
  patches:
    # setBox retains a pointer until performCalcNoUpdate; upstream 2.1's
    # block-local array dies too early and optimized builds can lose periodicity.
    - setbox-lifetime.patch

build:
  number: 0
  script: |
    cmake -S ${SRC_DIR} -B build ${CMAKE_ARGS} \
      -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
      -DOPENMM_DIR=${PREFIX} -DCMAKE_INSTALL_PREFIX=${PREFIX} \
      -DPLUMED_INCLUDE_DIR=${PREFIX}/include/plumed -DPLUMED_LIBRARY_DIR=${PREFIX}/lib \
      -DPYTHON_EXECUTABLE=${PYTHON} -DPIP_EXECUTABLE=${PREFIX}/bin/pip
    cmake --build build --parallel ${CPU_COUNT}
    cmake --install build
    # Upstream PythonInstall builds in isolation without NumPy; generate the
    # wrapper and build against this prefix, as the container does.
    cd build/python
    swig -python -c++ -o PlumedPluginWrapper.cpp -I${PREFIX}/include ${SRC_DIR}/python/plumedplugin.i
    ${PYTHON} -m pip install --no-build-isolation --no-deps .
    # Same provenance record as container/scripts/build-plumed.sh; the
    # container smoke test reads it.
    ${PYTHON} -c 'import json, pathlib, sys, openmm; p = pathlib.Path(sys.prefix) / "share/mdclaw"; p.mkdir(parents=True, exist_ok=True); (p / "plumed-build.json").write_text(json.dumps(dict(plumed="2.9.4", plugin="2.1", plugin_patch="box-pointer-lifetime-v1", plumed_commit="52da2bb76d37dbad0d19f59c6fe0b2ab939e3ded", plugin_commit="${{ commit }}", openmm=openmm.__version__), indent=2) + "\n")'

requirements:
  build:
    - if: linux
      then:
        - gcc_${{ target_platform }} 11.*
        - gxx_${{ target_platform }} 11.*
        - sysroot_${{ target_platform }} 2.17.*
      else:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    - cmake <4
    - make
    - swig
  host:
    - python 3.12.*
    - pip
    - setuptools
    - numpy
    - openmm 8.6.1.*
    - plumed
  run:
    - python 3.12.*
    - openmm 8.6.1.*
    - plumed

tests:
  - python:
      imports:
        - openmmplumed

about:
  homepage: https://github.com/openmm/openmm-plumed
  license: LGPL-3.0-or-later
  summary: openmm-plumed 2.1 with the MDClaw setBox patch, for conda-forge OpenMM 8.6.
