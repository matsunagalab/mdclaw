# openmm-plumed v2.1 with the container's setBox lifetime patch, built against
# conda-forge's OpenMM and PLUMED 2.9.4 (../plumed) for the default
# environment on linux-64, linux-aarch64 and osx-arm64. The cuda118 variant is
# ../openmm-plumed-cuda118.
[workspace]
# Lets `pixi build --path recipes/openmm-plumed` run standalone.
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "openmm-plumed"
version = "2.1"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.host-dependencies]
plumed = { path = "../plumed" }

[package.run-dependencies]
plumed = { path = "../plumed" }
