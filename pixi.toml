# MDClaw pixi manifest: the single dependency definition for the local dev
# environment and the container build (docs/developer/deploy-v2-plan.md).
#
#   pixi install          # create/update the env from pixi.lock (fast, locked)
#   pixi run mdclaw ...   # run the CLI inside the env
#   pixi run pytest ...   # run tests inside the env
#
# pixi resolves conda-forge first, then the PyPI layer through uv, and commits
# the whole solve to pixi.lock for every platform below. Unlike
# environment.yml, per-platform differences (hole2, MODELLER, CUDA) are
# expressed here directly instead of in sed lines inside Dockerfiles.
#
# Source-built pieces no conda package provides live in recipes/ and are built
# by pixi on install (pixi-build). The `cuda118` environment has all of them:
# OpenMM against CUDA 11.8, openmm-torch with PythonTorchForce (conda-forge's
# 1.5.1 lacks it and pins openmm <8.5), PLUMED 2.9.4 + openmm-plumed 2.1 with
# the setBox patch. The default environment does not yet carry openmm-torch or
# PLUMED (see docs/developer/conda-env-parity-plan.md). Still outside pixi:
#   - packmol-memgen fixes (v3numpy patch, PPM3 immers rebuild)
#   - hole2 on osx-arm64 (no conda-forge build; build from source or use
#     host binaries)

[workspace]
name = "mdclaw"
channels = ["conda-forge"]
# The cuda entries declare __cuda=12.9 as available at solve time so the lock
# selects the CUDA 12.9 builds of OpenMM/PyTorch on linux (conda-forge has no
# lower CUDA build for OpenMM >= 8.5, see the note in environment.yml; driver
# floor R575 for OpenMM's runtime-generated PTX). osx-arm64 solves
# CPU/OpenCL-only. The standard container uses this lock as its seed, then
# replaces the GPU stack with pinned CUDA 11.8 wheels and source-built OpenMM
# for older cluster drivers. RIKYU retains its separate CUDA 13 environment.
# The `cuda118` environment adds its own linux-64 platform with __cuda=11.8 and
# OpenMM built from source against CUDA 11.8 (recipes/openmm-cuda118), for
# drivers R520-R574 (floyd R550, n1-n5 R530): `pixi install -e cuda118`.
platforms = [
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.9" },
    { name = "linux-aarch64-cuda", platform = "linux-aarch64", cuda = "12.9" },
    { name = "linux-64-cuda118", platform = "linux-64", cuda = "11.8", glibc = "2.17" },
    "osx-arm64",
]
preview = ["pixi-build"]

[dependencies]
python = "3.12.*"
# conda-only or conda-preferred scientific stack (mirrors environment.yml)
ambertools = ">=24.0"
pdbfixer = ">=1.9"
rdkit = ">=2023.9.1"
openblas = "*"
matplotlib = "*"
pymol-open-source = "*"
pymbar = ">=4.2.0,<5"
mdanalysis = ">=2.8,<3"
openmm = ">=8.5.1"
openmmforcefields = ">=0.16.0"
openff-toolkit-base = ">=0.17.1"
openff-nagl = ">=0.5"
# openff-pablo runtime deps (rustworkx for graph algos, pyxdg for the CCD
# download cache location)
rustworkx = ">=0.14"
pyxdg = ">=0.28"
# hpacker (installed from git via pyproject.toml) pins biopython==1.81
# exactly. Under conda+pip that pin was silently satisfied by pip clobbering
# the conda biopython; the locked solve makes it explicit, so hold the conda
# package at the same version.
biopython = "1.81.*"
# HPacker imports torch; keep torch on conda-forge to avoid mixing wheel
# PyTorch with conda-forge protobuf on macOS. The version is set per GPU
# stack: 2.7 in `cuda129`, conda-forge's last CUDA 11.8 build in `cuda118`.
# Build toolchain so a local prefix can run container/scripts/build-plumed.sh
# and the openmm-torch source build.
cmake = ">=3.18,<4"
swig = "*"
patch = "*"
make = "*"
cxx-compiler = "*"
git = "*"
pip = "*"

# hole2: Fortran executables for pore analysis. conda-forge ships linux-64 /
# linux-aarch64 / osx-64 but no osx-arm64 build; on Apple Silicon build from
# source or provide `hole` on PATH (docs/developer/conda-env-parity-plan.md).
[target.linux-64.dependencies]
hole2 = "2.3.1.*"

[target.linux-aarch64.dependencies]
hole2 = "2.3.1.*"

[activation.env]
# Keep ~/.local/lib/pythonX.Y/site-packages out of the environment: a user's
# own pytest/numpy there shadowed the locked ones on floyd.
PYTHONNOUSERSITE = "1"

[target.linux-aarch64.activation.env]
# The official ARM MODELLER tarball is installed by install-modeller-arm64.py.
# Its bundled shared libraries have no loader path embedded in _modeller.so.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/modeller-10.8/lib/armv8-gnu:$CONDA_PREFIX/lib"

[pypi-dependencies]
# Editable install of this checkout; pulls and locks every [project]
# dependency from pyproject.toml (including the hpacker git reference and
# e3nn==0.5.0). The container build replaces it with a real install via
# `pip install --no-deps .` before packing.
mdclaw = { path = ".", editable = true }
# Pre-1.0, not on conda-forge / PyPI; pin the tag (same as environment.yml).
openff-pablo = { git = "https://github.com/openforcefield/openff-pablo.git", tag = "v0.2.2" }
# SST2 (simulated solute tempering), matsunagalab fork, pinned commit.
# ba48461 is the floor for charge-unscaled solutes (run_sst2 refuses older);
# 3dc7013 moves openmm to the SST2[openmm] extra so a conda/source-built
# OpenMM is not shadowed by a PyPI wheel.
sst2 = { git = "https://github.com/matsunagalab/SST2.git", rev = "3dc7013" }

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-asyncio = ">=0.21"
ruff = ">=0.1"

# MODELLER for modeller_from_alignment / the modeller-predict skill. The
# salilab channel covers linux-64 and osx-arm64, but not linux-aarch64, which takes
# the generic-tarball route (scripts/install-modeller-arm64.py for Pixi;
# Dockerfile.rikyu-arm64 for that image). No license key is baked
# in: mdclaw/genesis/modeller.py injects a synthetic modeller.config from a
# KEY_MODELLER* environment variable at call time.
[feature.modeller]
channels = ["salilab"]
# Restrict the dependency, not the feature's platforms: restricting the
# feature removes ARM from every environment that includes it.
[feature.modeller.target.linux-64.dependencies]
modeller = "10.8.*"

[feature.modeller.target.osx-arm64.dependencies]
modeller = "10.8.*"

# Default GPU stack: conda-forge's CUDA 12.9 builds (driver >= R575).
[feature.cuda129]
platforms = ["linux-64-cuda", "linux-aarch64-cuda", "osx-arm64"]

[feature.cuda129.dependencies]
pytorch = ">=2.7,<2.8"

[feature.cuda129.target.linux-64.dependencies]
cuda-version = "12.9.*"

[feature.cuda129.target.linux-aarch64.dependencies]
cuda-version = "12.9.*"

# Older drivers (R520-R574): OpenMM built from source against CUDA 11.8 (build
# toolkit from NVIDIA's cuda-11.8.0 label, runtime from conda-forge's
# cudatoolkit 11.8, shared with GPU PyTorch). Its platform declares glibc 2.17
# so the env installs on Ubuntu 18.04 nodes.
[feature.cuda118]
platforms = ["linux-64-cuda118"]
channels = ["conda-forge", "nvidia/label/cuda-11.8.0"]

[feature.cuda118.dependencies]
openmm = { path = "recipes/openmm-cuda118" }
cuda-version = "11.8.*"
# GPU PyTorch on CUDA 11.8: conda-forge's last CUDA 11.8 build is 2.5.1
# (glibc 2.17, cudatoolkit 11.8). NAGL 0.5.4 is the newest release that
# accepts it (0.5.5+ require pytorch >= 2.6).
pytorch = { version = "2.5.1.*", build = "cuda118*" }
openff-nagl = "==0.5.4"
# PythonTorchForce: openmm-torch built against the two packages above
# (conda-forge's openmm-torch 1.5.1 lacks it and pins openmm < 8.5).
openmm-torch = { path = "recipes/openmm-torch-cuda118" }
# PLUMED 2.9.4 and openmm-plumed 2.1 with the setBox patch, as in the container.
openmm-plumed = { path = "recipes/openmm-plumed-cuda118" }

# pixi does not run ocl-icd-system's post-link script, so the environment's
# OpenCL vendor directory stays empty and OpenMM registers no OpenCL platform.
# Point the loader at the host's ICDs (the NVIDIA driver installs one there).
[feature.cuda118.activation.env]
OCL_ICD_VENDORS = "/etc/OpenCL/vendors"


[environments]
default = { features = ["dev", "modeller", "cuda129"], solve-group = "main" }
cuda118 = { features = ["dev", "modeller", "cuda118"], solve-group = "cuda118" }
