# Packaged-runtime images, all from the committed pixi.lock. A vX.Y.Z tag builds
# each image on a native runner, runs the CPU smoke test, and publishes:
#
#   mdclaw:X.Y.Z, :latest      multi-arch: linux/amd64 (cuda118 environment, CUDA
#                              11.8) and linux/arm64 (default environment, CUDA
#                              12.9, also what Docker runs on Apple Silicon)
#   mdclaw:X.Y.Z-rikyu,        RIKYU, linux/arm64 (cuda13 environment, CUDA 13)
#     :latest-rikyu
#
# Triggers:
#   - tag push vX.Y.Z: build, smoke-test, publish. The tag must match the
#     plugin.json version (checked below).
#   - workflow_dispatch: validation build by default; set push_image to also
#     publish the versioned tags (no :latest) — useful to rebuild an image for
#     the current version without cutting a release.
#
# The GPU smoke test cannot run on hosted runners and stays a manual release
# gate before any shared SIF is replaced (docs/developer/deploy-v2-plan.md).
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Publish the built images to GHCR under the plugin.json version"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            dockerfile: container/Dockerfile.pixi
            build_args: ""
          - image: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: container/Dockerfile.pixi
            build_args: |
              PIXI_ENV=default
              CUDA_TOOLKIT=12.9
              RUNTIME_IMAGE=nvidia/cuda:12.9.1-base-ubuntu24.04@sha256:29e5e3425e2e0f5a4e97c9fb4695ba4887cd78210a43cf94c3bcafc6ab01c5e6
          - image: rikyu
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: container/Dockerfile.rikyu-arm64
            build_args: |
              BUILD_JOBS=4
    steps:
      - uses: actions/checkout@v4

      # Leave room for the scientific environment, source builds, and the final
      # image. Reclaim unrelated toolchains on this disposable hosted runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( available_kib < 60 * 1024 * 1024 )); then
            echo "Need at least 60 GiB free for the multi-stage build." >&2
            exit 1
          fi

      - name: Resolve version and check tag sync
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor build disk space
        run: |
          nohup bash -c '
            while sleep 15; do
              date -u
              df -h /
              available_kib=$(df -Pk / | awk "NR == 2 { print \$4 }")
              if (( available_kib < 10 * 1024 * 1024 )); then
                echo "::error::Stopping the builder: less than 10 GiB free."
                docker buildx stop
                exit 1
              fi
            done
          ' > "$RUNNER_TEMP/mdclaw-build-disk.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/mdclaw-build-disk.pid"

      # Export before loading: BuildKit's snapshots and Docker's unpacked image
      # otherwise coexist and exhaust the hosted runner's disk. Keep only final
      # image layers in the registry cache to limit export scratch space.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            ${{ matrix.build_args }}
          outputs: type=docker,dest=${{ runner.temp }}/mdclaw-image.tar
          tags: mdclaw:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.image }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.image }},mode=min

      - name: Release build cache and load image
        run: |
          docker buildx prune --all --force
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( available_kib < 40 * 1024 * 1024 )); then
            echo "Need at least 40 GiB free before loading the image." >&2
            exit 1
          fi
          docker load --input "$RUNNER_TEMP/mdclaw-image.tar"
          rm -f "$RUNNER_TEMP/mdclaw-image.tar"
          df -h /

      - name: Smoke test (CPU only; GPU smoke is a manual release gate)
        run: |
          docker run --rm \
            -v "$PWD/container/scripts/test-container.sh:/work/test.sh:ro" \
            mdclaw:ci bash /work/test.sh

      - name: Push to GHCR
        if: github.ref_type == 'tag' || inputs.push_image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          docker tag mdclaw:ci "$REPO:${VERSION}-${{ matrix.image }}"
          docker push "$REPO:${VERSION}-${{ matrix.image }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag mdclaw:ci "$REPO:latest-${{ matrix.image }}"
            docker push "$REPO:latest-${{ matrix.image }}"
          fi

      - name: Final disk usage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mdclaw-build-disk.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mdclaw-build-disk.pid")" 2>/dev/null || true
            cat "$RUNNER_TEMP/mdclaw-build-disk.log"
          fi
          df -h /
          docker system df

  # One tag for both architectures: `docker pull` and `singularity pull` take the
  # host's. RIKYU keeps its own tag, published by its build above.
  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.push_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          REPO="ghcr.io/${{ github.repository }}"
          TAGS=(-t "$REPO:$VERSION")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS+=(-t "$REPO:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$REPO:${VERSION}-amd64" "$REPO:${VERSION}-arm64"
          docker buildx imagetools inspect "$REPO:$VERSION"
