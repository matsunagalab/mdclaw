# Packaged-runtime image: build the amd64 image from the committed pixi.lock,
# run the CPU smoke test, and push to GHCR.
#
# Triggers:
#   - tag push vX.Y.Z: build, smoke-test, push :X.Y.Z and :latest. The tag
#     must match the plugin.json version (checked below).
#   - workflow_dispatch: validation build by default; set push_image to also
#     push the versioned tag (no :latest) — useful to rebuild an image for
#     the current version without cutting a release.
#
# The GPU smoke test cannot run on hosted runners and stays a manual release
# gate before any shared SIF is replaced (docs/developer/deploy-v2-plan.md).
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the built image to GHCR under the plugin.json version tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # The 3-stage build (pixi env ~5 GB, OpenMM/PLUMED source builds, final
      # image) does not fit the default ~14 GB of free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Resolve version and check tag sync
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache lives on GHCR, so a rebuild with an unchanged pixi.lock
      # reuses stage 1 and an unchanged OpenMM/PLUMED pin reuses stage 2.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          load: true
          tags: mdclaw:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Smoke test (CPU only; GPU smoke is a manual release gate)
        run: |
          docker run --rm \
            -v "$PWD/container/scripts/test-container.sh:/work/test.sh:ro" \
            mdclaw:ci bash /work/test.sh

      - name: Push to GHCR
        if: github.ref_type == 'tag' || inputs.push_image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker tag mdclaw:ci "ghcr.io/${{ github.repository }}:${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:${VERSION}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag mdclaw:ci "ghcr.io/${{ github.repository }}:latest"
            docker push "ghcr.io/${{ github.repository }}:latest"
          fi
