# Packaged-runtime images: build the amd64 image (`pixi install -e cuda118
# --locked`, container/Dockerfile.pixi) and RIKYU's arm64 image (`pixi install -e
# cuda13 --locked`, container/Dockerfile.rikyu-arm64) from the committed
# pixi.lock, run the CPU smoke test, and push to GHCR. The arm64 image goes to
# the same package under the tag X.Y.Z-rikyu and never to :latest.
#
# Triggers:
#   - tag push vX.Y.Z: build, smoke-test, push :X.Y.Z and :latest. The tag
#     must match the plugin.json version (checked below).
#   - workflow_dispatch: validation build by default; set push_image to also
#     push the versioned tag (no :latest) — useful to rebuild an image for
#     the current version without cutting a release.
#
# The GPU smoke test cannot run on hosted runners and stays a manual release
# gate before any shared SIF is replaced (docs/developer/deploy-v2-plan.md).
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the built image to GHCR under the plugin.json version tag"
        type: boolean
        default: false
      image:
        description: "Which image to build"
        type: choice
        options: [both, amd64, rikyu]
        default: both

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.image != 'rikyu'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Leave room for the scientific environment, source builds, and the final
      # image. Reclaim unrelated toolchains on this disposable hosted runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( available_kib < 60 * 1024 * 1024 )); then
            echo "Need at least 60 GiB free for the multi-stage build." >&2
            exit 1
          fi

      - name: Resolve version and check tag sync
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor build disk space
        run: |
          nohup bash -c '
            while sleep 15; do
              date -u
              df -h /
              available_kib=$(df -Pk / | awk "NR == 2 { print \$4 }")
              if (( available_kib < 10 * 1024 * 1024 )); then
                echo "::error::Stopping the builder: less than 10 GiB free."
                docker buildx stop
                exit 1
              fi
            done
          ' > "$RUNNER_TEMP/mdclaw-build-disk.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/mdclaw-build-disk.pid"

      # Export before loading: BuildKit's snapshots and Docker's unpacked image
      # otherwise coexist and exhaust the hosted runner's disk. Keep only final
      # image layers in the registry cache to limit export scratch space.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile.pixi
          outputs: type=docker,dest=${{ runner.temp }}/mdclaw-image.tar
          tags: mdclaw:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=min

      - name: Release build cache and load image
        run: |
          docker buildx prune --all --force
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          if (( available_kib < 40 * 1024 * 1024 )); then
            echo "Need at least 40 GiB free before loading the image." >&2
            exit 1
          fi
          docker load --input "$RUNNER_TEMP/mdclaw-image.tar"
          rm -f "$RUNNER_TEMP/mdclaw-image.tar"
          df -h /

      - name: Smoke test (CPU only; GPU smoke is a manual release gate)
        run: |
          docker run --rm \
            -v "$PWD/container/scripts/test-container.sh:/work/test.sh:ro" \
            mdclaw:ci bash /work/test.sh

      - name: Push to GHCR
        if: github.ref_type == 'tag' || inputs.push_image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker tag mdclaw:ci "ghcr.io/${{ github.repository }}:${VERSION}"
          docker push "ghcr.io/${{ github.repository }}:${VERSION}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag mdclaw:ci "ghcr.io/${{ github.repository }}:latest"
            docker push "ghcr.io/${{ github.repository }}:latest"
          fi

      - name: Final disk usage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mdclaw-build-disk.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mdclaw-build-disk.pid")" 2>/dev/null || true
            cat "$RUNNER_TEMP/mdclaw-build-disk.log"
          fi
          df -h /
          docker system df

  # Hosted arm runners are native, so the recipes compile at full speed. The GPU
  # acceptance (test-rikyu-gpu.sh) must run from the SIF on RIKYU.
  build-rikyu:
    if: inputs.image != 'amd64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Resolve version and check tag sync
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile.rikyu-arm64
          platforms: linux/arm64
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_JOBS=4
          outputs: type=docker,dest=${{ runner.temp }}/mdclaw-image.tar
          tags: mdclaw:ci-rikyu
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-rikyu
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-rikyu,mode=min

      - name: Release build cache and load image
        run: |
          docker buildx prune --all --force
          docker load --input "$RUNNER_TEMP/mdclaw-image.tar"
          rm -f "$RUNNER_TEMP/mdclaw-image.tar"
          df -h /

      - name: Smoke test (CPU only; GPU acceptance runs from the SIF on RIKYU)
        run: |
          docker run --rm \
            -v "$PWD/container/scripts/test-container.sh:/work/test.sh:ro" \
            mdclaw:ci-rikyu bash /work/test.sh

      - name: Push to GHCR
        if: github.ref_type == 'tag' || inputs.push_image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker tag mdclaw:ci-rikyu "ghcr.io/${{ github.repository }}:${VERSION}-rikyu"
          docker push "ghcr.io/${{ github.repository }}:${VERSION}-rikyu"
